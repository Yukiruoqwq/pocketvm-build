<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PocketVM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<!-- no-panel: the right column starts closed and opens itself when there is
     something in it. -->
<div class="app no-panel" id="app">

  <aside class="sidebar" id="sidebar">
    <header class="ws">
      <button class="ws-name" type="button">
        <span>工作</span>
        <svg viewBox="0 0 16 16" class="chev"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="ws-actions">
        <button class="icon-btn" type="button" title="搜索聊天或运行命令">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" type="button" title="定时任务">
          <svg viewBox="0 0 16 16"><path d="M8 2.2a3.4 3.4 0 0 0-3.4 3.4v2.2L3.4 10h9.2l-1.2-2.2V5.6A3.4 3.4 0 0 0 8 2.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.6 12.2a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="nav">
      <button class="nav-item" type="button" id="newThread">
        <svg viewBox="0 0 16 16"><rect x="2.2" y="2.8" width="11.6" height="10.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 8h5.2M8 5.4v5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>新对话</span>
      </button>
      <button class="nav-item" type="button" id="navAutomations">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.2V8l2 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>定时任务</span>
      </button>
    </nav>

    <section class="group">
      <h2>项目</h2>
      <p class="empty">没有项目</p>
    </section>

    <section class="group grow">
      <h2>最近</h2>
      <ul class="thread-list" id="threadList"></ul>
    </section>

    <footer class="account" id="account">
      <span class="avatar" aria-hidden="true"></span>
      <span class="account-name" id="accountName">PocketVM</span>
      <span class="account-state" id="accountState">未登录</span>
    </footer>
  </aside>

  <main class="conversation">
    <header class="thread-head">
      <h1 id="threadTitle">新对话</h1>
      <div class="thread-head-actions">
        <button class="icon-btn" type="button" id="headerMenu" title="更多">
          <svg viewBox="0 0 16 16"><circle cx="4" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="12" cy="8" r="1.1" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" type="button" id="toggleBottomPanel" title="切换底部面板显示">
          <svg viewBox="0 0 16 16"><rect x="2.2" y="3" width="11.6" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.2 9.4h11.6" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" type="button" id="toggleSidePanel" title="显示/隐藏侧边面板" aria-pressed="false">
          <svg viewBox="0 0 16 16"><rect x="2.2" y="3" width="11.6" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-column">
        <textarea id="composerInput" rows="1" placeholder="使用 Codex"></textarea>
        <div class="composer-bar">
          <button class="icon-btn" type="button" id="contextButton" title="添加文件等内容" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="composer-right">
            <button class="chip" type="button" id="accessChip" title="权限">完全访问</button>
            <button class="chip model-chip" type="button" id="modelChip" title="模型和推理强度" aria-haspopup="menu" aria-expanded="false">
              <span id="modelName">Codex</span>
              <span class="model-effort" id="modelEffort">中</span>
            </button>
            <button class="send" type="button" id="sendBtn" title="发送">
              <svg viewBox="0 0 16 16"><path d="M8 12.4V3.6M4.4 7.2L8 3.6l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <section class="automations" id="automations" hidden>
    <header class="automations-head">
      <div class="automations-title">
        <h1>定时任务</h1>
        <p>询问 ChatGPT，让其安排任务、设置提醒或监控更新</p>
      </div>
      <button class="btn-primary" type="button" id="newAutomation">安排任务</button>
    </header>

    <div class="automations-filter" id="automationFilter" role="tablist">
      <button class="active" type="button" data-filter="all">全部</button>
      <button type="button" data-filter="active">已开启</button>
      <button type="button" data-filter="paused">已暂停</button>
      <button type="button" data-filter="completed">已完成</button>
    </div>

    <ul class="automation-list" id="automationList"></ul>

    <div class="automations-composer">
      <div class="automations-composer-box">
        <textarea id="automationInput" rows="1" placeholder="安排任务"></textarea>
        <button class="send" type="button" id="automationSend" title="发送">
          <svg viewBox="0 0 16 16"><path d="M8 12.4V3.6M4.4 7.2L8 3.6l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="automation-editor" id="automationEditor" hidden>
    <div class="automation-editor-panel" role="dialog" aria-modal="true" aria-labelledby="automationEditorTitle">
      <header class="automation-editor-head">
        <h2 id="automationEditorTitle">编辑任务</h2>
        <button class="icon-btn" type="button" id="automationEditorClose" title="关闭">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="automation-editor-body">
        <label class="field">
          <span>名称</span>
          <input id="automationName" type="text" placeholder="任务名称">
        </label>
        <label class="field">
          <span>重复</span>
          <select id="automationCadence">
            <option value="daily">每天</option>
            <option value="weekdays">工作日</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </label>
        <label class="field">
          <span>时间</span>
          <input id="automationTime" type="time" value="22:00">
        </label>
      </div>
      <footer class="automation-editor-foot">
        <button class="btn-ghost" type="button" id="automationDelete">删除</button>
        <div class="spacer"></div>
        <button class="btn-ghost" type="button" id="automationCancel">取消</button>
        <button class="btn-primary" type="button" id="automationSave">保存</button>
      </footer>
    </div>
  </div>

  <div class="ctx-menu" id="ctxMenu" hidden>
    <button class="ctx-item" type="button" data-ctx="files">
      <span>文件和文件夹</span>
    </button>
    <button class="ctx-item" type="button" data-ctx="photos">
      <span>添加照片</span>
    </button>
    <button class="ctx-item" type="button" data-ctx="remote">
      <span>添加远程文件</span>
    </button>
    <button class="ctx-item" type="button" data-ctx="skill">
      <span>录制技能</span>
    </button>
  </div>

  <div class="model-menu" id="modelMenu" hidden>
    <p class="model-menu-title">推理</p>
    <p class="model-menu-section">模型</p>
    <ul class="model-menu-list" id="modelList"></ul>
    <p class="model-menu-section">推理强度</p>
    <ul class="model-menu-list" id="effortList"></ul>
    <label class="speed-row" id="speedRow" hidden>
      <span class="speed-text">
        <span class="speed-title">快速</span>
        <span class="speed-desc">1.5 倍速度，用量更多</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="speedToggle" aria-label="启用快速模式">
        <span></span>
      </span>
    </label>
  </div>

  <div class="header-menu" id="headerMenuPanel" hidden>
    <label class="menu-check"><input type="checkbox" id="menuBottomPanel"><span>底部面板</span></label>
    <label class="menu-check"><input type="checkbox" id="menuSidePanel"><span>显示/隐藏侧边面板</span></label>
    <button class="menu-item" type="button" id="menuSettings">设置…</button>
  </div>

  <!-- 头像菜单: what the account is, and how much of it is left. The usage
       block stays hidden until the guest's own Codex has reported limits. -->
  <div class="account-menu" id="accountMenu" hidden>
    <div class="account-menu-head">
      <span class="avatar" aria-hidden="true"></span>
      <span class="account-menu-name" id="accountMenuName">PocketVM</span>
      <span class="account-menu-state" id="accountMenuState">未登录</span>
    </div>
    <div class="account-menu-usage" id="accountMenuUsage" hidden></div>
    <button class="account-menu-item" type="button" id="accountMenuSettings">设置…</button>
  </div>

  <div class="command-menu" id="commandMenuPanel" hidden>
    <input id="commandSearch" type="text" placeholder="搜索聊天或运行命令">
    <ul id="commandList"></ul>
  </div>

  <aside class="side-panel" id="sidePanel">
    <section class="panel-section" data-section="plan">
      <header class="panel-head">
        <h2>计划</h2>
        <button class="icon-btn" type="button" data-add="plan" title="添加">
          <svg viewBox="0 0 16 16"><path d="M8 3.6v8.8M3.6 8h8.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <ul class="plan-list" id="planList"></ul>
    </section>

  </aside>

  <section class="bottom-panel" id="bottomPanel" hidden>
    <header class="bottom-head">
      <button class="tab-item active" type="button">终端</button>
      <!-- What the console itself knows: connected or not, how many bytes the
           page has received, and what size the emulator was given. A blank
           panel with "收到 45 KB" on it is a rendering problem; a blank panel
           with "收到 0 字节" is a console that never arrived. -->
      <span class="terminal-state" id="terminalState">未连接</span>
      <button class="icon-btn" type="button" id="closeBottomPanel" title="隐藏底部面板">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="terminal-host" id="terminalHost"></div>
    <!-- A console needs keys the iPad keyboard does not have: Esc, Tab, the
         arrows, and above all Ctrl+C. Each button writes the byte a terminal
         would send, so the guest sees exactly what its own keyboard would. -->
    <div class="key-row" id="keyRow">
      <button class="key" type="button" data-key="escape">esc</button>
      <button class="key" type="button" data-key="tab">tab</button>
      <button class="key" type="button" id="ctrlKey" data-key="ctrl" aria-pressed="false">ctrl</button>
      <button class="key" type="button" data-key="ctrl-c">^C</button>
      <button class="key" type="button" data-key="ctrl-d">^D</button>
      <button class="key" type="button" data-key="ctrl-z">^Z</button>
      <span class="key-spacer"></span>
      <button class="key" type="button" data-key="arrow-left">←</button>
      <button class="key" type="button" data-key="arrow-up">↑</button>
      <button class="key" type="button" data-key="arrow-down">↓</button>
      <button class="key" type="button" data-key="arrow-right">→</button>
    </div>
  </section>
</div>

<div class="settings" id="settings" hidden>
  <header class="settings-head">
    <h1>设置</h1>
    <button class="icon-btn" type="button" id="closeSettings" title="关闭">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="settings-body">
    <nav class="settings-nav" id="settingsNav"></nav>
    <div class="settings-content" id="settingsContent"></div>
  </div>
</div>

<!-- Covers the app until the guest's Codex CLI answers. Left out of the way
     rather than removed: it comes back when the machine stops. -->
<div class="vm-gate" id="vmGate" role="dialog" aria-modal="true" aria-labelledby="vmGateTitle">
  <div class="vm-gate-card" id="vmGateCard"></div>
</div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="terminal.js"></script>
<script src="app.js"></script>
</body>
</html>
