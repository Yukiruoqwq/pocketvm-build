name: Build PocketVM

on:
  workflow_dispatch:
    inputs:
      build_runtime:
        description: "Rebuild the QEMU runtime from UTM's sources instead of using the release asset"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  # UTM release whose dependency build the runtime comes from. Bumping it means
  # producing a new runtime archive, so it is also the runtime cache key.
  UTM_COMMIT: b6f7475be54f9cb542c46b131319454b83489ced
  # aarch64-only runtime, assembled from that build by scripts/slim_runtime.mjs.
  # Building the whole dependency sysroot from source takes tens of minutes and
  # nothing about it changes when the app does; this takes seconds.
  RUNTIME_URL: https://github.com/abasbdjasdl/pocketvm-build/releases/download/runtime-1/pocketvm-runtime-ios-arm64.tar.gz

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Validate guest protocol and scripts
        run: |
          node --test scripts/test-app-server.mjs
          node --test scripts/test-terminal-replay.cjs
          node --test scripts/test-boot-services.mjs
          node --check web/app.js
          node --check web/terminal.js
          for script in guest/*.sh; do bash -n "$script"; done

      - name: Select Xcode
        run: |
          set -euo pipefail
          candidate=/Applications/Xcode_26.0.app
          if [ -d "$candidate" ]; then
            sudo xcode-select -s "$candidate"
          else
            latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The runtime is a release asset in this repository: see the release named
      # runtime-1. Rebuilding it is a deliberate choice, not a fallback, because
      # it costs roughly forty minutes of runner time and nothing about it
      # changes when the app does.
      - name: Test host protocol channel
        run: |
          xcrun swiftc -parse-as-library Sources/CodexChannel.swift scripts/test-channel.swift -o "$RUNNER_TEMP/channel-tests"
          "$RUNNER_TEMP/channel-tests"
          xcrun swiftc -parse-as-library Sources/VMConfiguration.swift Sources/ExecutionMode.swift Sources/BootProgress.swift scripts/test-runtime-settings.swift -o "$RUNNER_TEMP/settings-tests"
          "$RUNNER_TEMP/settings-tests"

      - name: Fetch prebuilt runtime
        if: ${{ !inputs.build_runtime }}
        run: |
          set -euo pipefail
          curl -fsSL "$RUNTIME_URL" -o "$RUNNER_TEMP/runtime.tar.gz"
          rm -rf Dependencies
          # The archive already carries the Dependencies/ prefix; extracting it
          # into a directory of the same name would nest it one level deeper,
          # which is how this step first failed.
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C "$PWD"
          test -f Dependencies/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu
          test -f Dependencies/qemu/edk2-aarch64-code.fd
          du -sh Dependencies

      - name: Build tools
        if: ${{ inputs.build_runtime }}
        run: |
          brew install xcodegen bison pkg-config gettext glib-utils libgpg-error \
            nasm make meson cmake llvm spirv-llvm-translator libxcb libxrandr
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          python3 -m venv .build-python
          .build-python/bin/pip install six pyparsing pyyaml setuptools distlib mako
          echo "$GITHUB_WORKSPACE/.build-python/bin" >> "$GITHUB_PATH"

      - name: Build dependency sysroot from source
        if: ${{ inputs.build_runtime }}
        run: |
          set -o pipefail
          git clone --filter=blob:none --no-checkout https://github.com/utmapp/UTM.git utm-src
          git -C utm-src checkout "$UTM_COMMIT"
          cd utm-src
          ./scripts/build_dependencies.sh -p ios -a arm64 2>&1 | tee ../dependencies.log
          mv sysroot-iOS-arm64 ..
          cd ..
          # The dependency build lays the frameworks out as a sysroot, not as an
          # application bundle, so it is copied whole: slim_runtime.mjs prunes an
          # app bundle and would have to grow a second code path to do this one.
          bash scripts/prepare_dependencies.sh "$PWD/sysroot-iOS-arm64"

      - name: Prepare interpreter runtime
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/utmapp/UTM/releases/download/v5.0.5/UTM-SE.ipa -o "$RUNNER_TEMP/UTM-SE.ipa"
          echo "a2496c8435cedfb7373ba6f53884cca1aff54e030628258e91d7bb5685aa1334  $RUNNER_TEMP/UTM-SE.ipa" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/UTM-SE.ipa" 'Payload/*.app/Frameworks/*' 'Payload/*.app/qemu/*' -d "$RUNNER_TEMP/utm-se"
          SE_APP="$(find "$RUNNER_TEMP/utm-se/Payload" -maxdepth 1 -name '*.app' -type d | head -1)"
          node scripts/slim_runtime.mjs "$SE_APP" "$RUNNER_TEMP/interpreter"
          python3 scripts/prepare_interpreter.py "$RUNNER_TEMP/interpreter" Dependencies

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project PocketVM.xcodeproj -scheme PocketVM \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/PocketVM.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="PocketVM.xcarchive/Products/Applications/PocketVM.app"
          test -f "$APP/PocketVM"
          test -f "$APP/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu"
          test -f "$APP/Frameworks/tciu-aarch64-softmmu.framework/tciu-aarch64-softmmu"
          test -f "$APP/qemu/edk2-aarch64-code.fd"
          xcrun lipo "$APP/PocketVM" -verify_arch arm64
          xcrun lipo "$APP/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu" -verify_arch arm64
          # The guest image is fetched on the device; anything larger than a few
          # hundred megabytes here means something got bundled by accident.
          du -sh "$APP"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/PocketVM.app
          (cd package && zip -qry ../PocketVM.ipa Payload)
          unzip -tq PocketVM.ipa
          shasum -a 256 PocketVM.ipa | tee SHA256SUMS
          ls -lh PocketVM.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketVM-build
          path: |
            PocketVM.ipa
            SHA256SUMS
            app-build.log
            dependencies.log
          if-no-files-found: warn
